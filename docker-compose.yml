
name: ai-chatbot

services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: ai-chatbot-backend

    env_file:
      - .env

    ports:
      - "8000:8000"

    volumes:
      - sqlite_data:/data

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"

      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}

    container_name: ai-chatbot-frontend

    ports:
      - "3000:3000"

    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped


volumes:
  sqlite_data:
    name: ai_chatbot_sqlite_data
